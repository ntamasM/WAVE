<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAVE - Loading</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: none;
      }

      .app-container {
        background: linear-gradient(135deg, #41ae98 0%, #346b60 50%, #272727 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        border-radius: 50px;
        overflow: hidden;
      }

      .splash-container {
        text-align: center;
        color: white;
        max-width: 800px;
        width: 90%;
        padding: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }

      .illustration {
        height: 40svh;
        animation: fadeInUp 1s ease-out;
      }

      .illustration img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.4));
      }

      .brand-section {
        animation: fadeInUp 1s ease-out 0.2s both;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .app-name-version {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .app-name-version .name {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, #ffffff 0%, #41ae98 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .app-name-version .version {
        font-size: 14px;
        color: #b2dfdb;
        font-weight: 400;
        letter-spacing: 0.5px;
        line-height: 1;
      }

      .tagline {
        font-size: 22px;
        color: #e0f2f1;
        font-weight: 300;
        letter-spacing: 1.5px;
      }

      .loading-section {
        animation: fadeInUp 1s ease-out 0.4s both;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .loading-text {
        font-size: 18px;
        color: #b2dfdb;
        font-weight: 400;
      }

      .loading-dots {
        display: inline-flex;
        gap: 10px;
        margin-top: 12px;
      }

      .dot {
        width: 12px;
        height: 12px;
        background: #41ae98;
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(65, 174, 152, 0.6);
        animation: dotBounce 1.4s ease-in-out infinite;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dotBounce {
        0%,
        60%,
        100% {
          transform: translateY(0) scale(1);
          opacity: 0.6;
        }
        30% {
          transform: translateY(-15px) scale(1.2);
          opacity: 1;
          box-shadow: 0 0 25px rgba(65, 174, 152, 0.9);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="splash-container">
        <div class="illustration">
          <img src="app-media://Splash-Screen-Illustration.svg" alt="WAVE Illustration" />
        </div>

        <div class="brand-section">
          <h1 class="app-name-version"><span class="name">WAVE </span><span class="version">V0.0.15</span></h1>
          <h2 class="tagline">Work · Rest · Balance · Health</h2>
        </div>

        <div class="loading-section">
          <span class="loading-text">Initializing application...</span>
          <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
