name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET (required for vpk CLI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install vpk CLI
        run: dotnet tool install -g vpk

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Extract version from package.json
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build renderer (shared)
        run: pnpm run build

      # ── x64 ──────────────────────────────────────────────────────────────────

      - name: Build unpacked x64
        run: pnpm exec electron-builder --win --x64 --config electron-builder.yml --publish never
        # electron-builder outputs x64 to dist/win-unpacked (no arch suffix)

      - name: Pack x64 with Velopack
        run: |
          vpk pack `
            --packId com.ntamadakis.wave `
            --packTitle WAVE `
            --packVersion ${{ steps.version.outputs.VERSION }} `
            --packDir dist/win-unpacked `
            --mainExe WAVE.exe `
            --icon dist/.icon-ico/icon.ico `
            --outputDir Releases-x64

      # ── ia32 ─────────────────────────────────────────────────────────────────

      - name: Build unpacked ia32
        run: pnpm exec electron-builder --win --ia32 --config electron-builder.yml --publish never
        # electron-builder outputs ia32 to dist/win-ia32-unpacked

      - name: Pack ia32 with Velopack
        run: |
          vpk pack `
            --packId com.ntamadakis.wave-x86 `
            --packTitle "WAVE (32-bit)" `
            --packVersion ${{ steps.version.outputs.VERSION }} `
            --packDir dist/win-ia32-unpacked `
            --mainExe WAVE.exe `
            --icon dist/.icon-ico/icon.ico `
            --outputDir Releases-x86

      # ── upload ────────────────────────────────────────────────────────────────

      - name: Upload x64 to GitHub Releases
        run: |
          vpk upload github `
            --repoUrl https://github.com/ntamasM/WAVE `
            --publish `
            --releaseName "WAVE v${{ steps.version.outputs.VERSION }}" `
            --tag ${{ github.ref_name }} `
            --token ${{ secrets.GITHUB_TOKEN }} `
            --outputDir Releases-x64

      - name: Upload ia32 assets to GitHub Releases
        run: |
          $files = (Get-ChildItem Releases-x86 -File).FullName
          gh release upload ${{ github.ref_name }} $files --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
