appId: 'com.ntamadakis.wave'
productName: 'WAVE'
directories:
  buildResources: assets
  output: dist
files:
  - from: .
    to: .
    filter:
      - '!**/*.map'
      - '!**/*.ts'
      - '!dist/*'
      - '!src'
      - '!.gitignore'
      - '!.eslintrc*'
      - '!.prettierrc*'
      - '!tsconfig*.json'
      - '!*.config.js'
      - '!*.config.ts'
      - '!pnpm-lock.yaml'
      - '!pnpm-workspace.yaml'
      - '!README.md'
  - from: out
    to: .
    filter:
      - '**/*'
asarUnpack:
  - '**/*.node'
compression: maximum
extraMetadata:
  main: main/index.js
extraResources:
  - from: assets/media
    to: media
    filter:
      - '**/*'
  - from: assets/app-media
    to: app-media
    filter:
      - '**/*'
win:
  target:
    - target: dir
  icon: assets/app-media/Wave--icon.png
  publisherName: 'Manolis Ntamadakis'
electronLanguages:
  - en
  - en-US
