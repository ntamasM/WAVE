appId: 'com.wave'
productName: 'WAVE'
directories:
  buildResources: assets
  output: dist
# Optimize file inclusion - only include necessary files
files:
  - from: .
    to: .
    filter:
      - '!**/*.map'
      - '!**/*.ts'
      - '!dist/*'
      - '!node_modules'
      - '!src'
      - '!.gitignore'
      - '!.eslintrc*'
      - '!.prettierrc*'
      - '!tsconfig*.json'
      - '!*.config.js'
      - '!*.config.ts'
      - '!pnpm-lock.yaml'
      - '!pnpm-workspace.yaml'
      - '!README.md'
  - from: out
    to: .
    filter:
      - '**/*'
# Only include runtime dependencies, exclude dev dependencies
asarUnpack:
  - '**/*.node'
# Optimize compression
compression: maximum
# Exclude unnecessary files
extraMetadata:
  main: main/index.js
extraResources:
  - from: assets/media
    to: media
    filter:
      - '**/*'
  - from: assets/app-media
    to: app-media
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/app-media/Wave--icon.png
  certificateFile: null
  sign: null
  signingHashAlgorithms: []
  artifactName: '${productName}-${version}-${arch}-setup.${ext}'
  publisherName: 'Manolis Ntamadakis'
  verifyUpdateCodeSignature: false
# Optimize by including only English locale
electronLanguages:
  - en
  - en-US
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WAVE
  license: LICENSE
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  menuCategory: true
  displayLanguageSelector: false
  artifactName: '${productName}-${version}-setup.${ext}'
  # Enable compression for NSIS installer
  differentialPackage: true
portable:
  artifactName: '${productName}-${version}-portable.${ext}'
